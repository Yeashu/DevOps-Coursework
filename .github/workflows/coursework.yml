name: CI/CD, DevSecOps and coursework evidence

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coursework-${{ github.ref }}
  cancel-in-progress: false

jobs:
  kubernetes:
    name: Kubernetes and Helm (${{ matrix.lab }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - lab: session13
            sections: session13-storage-hpa-probes
          - lab: session14
            sections: session14-troubleshooting
          - lab: session15
            sections: session15-helm
          - lab: basics
            sections: linux-fundamentals git-and-github session9-k8s session-12-ingress-configmaps-secrets
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lab tools and start Kubernetes
        run: |
          python -m pip install Pillow PyYAML
          curl -fsSL https://storage.googleapis.com/minikube/releases/latest/minikube-linux-amd64 -o /tmp/minikube
          sudo install /tmp/minikube /usr/local/bin/minikube
          helm_release=v3.17.3
          curl -fsSL "https://get.helm.sh/helm-${helm_release}-linux-amd64.tar.gz" -o /tmp/helm.tar.gz
          tar -xzf /tmp/helm.tar.gz -C /tmp
          sudo install /tmp/linux-amd64/helm /usr/local/bin/helm
          minikube start --driver=docker --cpus=2 --memory=4096 --cni=calico
          minikube addons enable metrics-server
          kubectl -n kube-system rollout status deployment/metrics-server --timeout=240s
          kubectl get nodes -o wide
      - name: Execute lab and record actual output
        run: |
          set -euo pipefail

          repo_root="$GITHUB_WORKSPACE"
          cd "$repo_root"

          record() {
            local destination="$1"
            shift
            mkdir -p "$(dirname "$destination")"
            (
              set -euo pipefail
              PS4='$ '
              set -x
              "$@"
            ) > "$destination" 2>&1
            cat "$destination"
          }

          wait_ready() {
            kubectl -n "$ns" wait --for=condition=Ready "pod/$1" --timeout=240s
          }

          expect_error() {
            local expected="$1"
            shift
            local result
            if result=$("$@" 2>&1); then
              printf '%s\n' "$result"
              echo "Expected a failure but the command succeeded." >&2
              return 1
            fi
            printf '%s\n' "$result"
            [[ "$result" == *"$expected"* ]]
          }

          publish_image() {
          set -euo pipefail
          source_image="$1"
          package="$2"
          output="$3"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          destination="ghcr.io/$owner/$package:${GITHUB_SHA}"
          mkdir -p "$(dirname "$output")"
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag "$source_image" "$destination"
          {
            printf '$ docker push %s\n' "$destination"
            docker push "$destination"
            printf '$ docker image inspect %s --format {{.Id}}\n' "$destination"
            docker image inspect "$destination" --format '{{.Id}}'
          } > "$output" 2>&1
          cat "$output"

          }

          case "${{ matrix.lab }}" in
          session13)
          ns=coursework-s13
          section=session13-storage-hpa-probes
          kubectl create namespace "$ns" --dry-run=client -o yaml | kubectl apply -f -

          volumes() {
            kubectl -n "$ns" apply -f "$section/01-kubernetes-volumes/emptydir-demo.yaml"
            wait_ready emptydir-demo
            kubectl -n "$ns" exec emptydir-demo -- sh -c 'echo emptydir-marker > /data/marker; cat /data/marker'
            kubectl -n "$ns" delete pod emptydir-demo --wait=true
            kubectl -n "$ns" apply -f "$section/01-kubernetes-volumes/emptydir-demo.yaml"
            wait_ready emptydir-demo
            kubectl -n "$ns" exec emptydir-demo -- sh -c 'test ! -f /data/marker && echo "emptyDir marker disappeared with old Pod"'
            kubectl -n "$ns" apply -f "$section/01-kubernetes-volumes/hostpath-demo.yaml"
            wait_ready hostpath-demo
            kubectl -n "$ns" exec hostpath-demo -- sh -c 'echo hostpath-marker > /data/marker'
            kubectl -n "$ns" delete pod hostpath-demo --wait=true
            kubectl -n "$ns" apply -f "$section/01-kubernetes-volumes/hostpath-demo.yaml"
            wait_ready hostpath-demo
            kubectl -n "$ns" exec hostpath-demo -- sh -c 'grep hostpath-marker /data/marker'
            kubectl -n "$ns" apply -f "$section/01-kubernetes-volumes/static-storage.yaml"
            wait_ready persistent-demo
            kubectl get pv coursework-s13-pv
            kubectl -n "$ns" get pvc static-data
            kubectl -n "$ns" exec persistent-demo -- sh -c 'echo persistent-marker > /data/marker'
            kubectl -n "$ns" delete pod persistent-demo --wait=true
            kubectl -n "$ns" apply -f "$section/01-kubernetes-volumes/static-storage.yaml"
            wait_ready persistent-demo
            kubectl -n "$ns" exec persistent-demo -- grep persistent-marker /data/marker
            kubectl get storageclass -o wide
            kubectl -n "$ns" apply -f "$section/01-kubernetes-volumes/dynamic-storage.yaml"
            wait_ready dynamic-demo
            dynamic_pv=$(kubectl -n "$ns" get pvc dynamic-data -o jsonpath='{.spec.volumeName}')
            kubectl get pv "$dynamic_pv" -o wide
            kubectl -n "$ns" delete pod dynamic-demo
            kubectl -n "$ns" delete pvc dynamic-data
            kubectl wait --for=delete "pv/$dynamic_pv" --timeout=120s
            echo 'Dynamic Delete-policy PV removed after claim deletion.'
          }

          autoscaling() {
            kubectl -n "$ns" apply -f "$section/02-hpa/hpa.yml"
            kubectl -n "$ns" rollout status deployment/cpu-demo --timeout=240s
            for attempt in $(seq 1 36); do
              kubectl -n "$ns" top pods 2>/dev/null && break
              sleep 5
            done
            kubectl -n "$ns" get hpa
            kubectl -n "$ns" describe hpa cpu-demo
            kubectl -n "$ns" apply -f "$section/02-hpa/load-generator.yaml"
            wait_ready load-generator
            scaled=0
            for attempt in $(seq 1 72); do
              kubectl -n "$ns" get hpa
              replicas=$(kubectl -n "$ns" get deployment cpu-demo -o jsonpath='{.spec.replicas}')
              if (( replicas >= 2 )); then scaled=1; break; fi
              sleep 5
            done
            test "$scaled" = 1
            kubectl -n "$ns" rollout status deployment/cpu-demo --timeout=180s
            kubectl -n "$ns" get pods -o wide
            kubectl -n "$ns" top pods
            kubectl -n "$ns" describe hpa cpu-demo
            kubectl -n "$ns" delete pod load-generator
            for attempt in $(seq 1 60); do
              replicas=$(kubectl -n "$ns" get deployment cpu-demo -o jsonpath='{.spec.replicas}')
              if (( replicas == 1 )); then break; fi
              sleep 5
            done
            test "$replicas" = 1
            kubectl -n "$ns" get hpa,pods
            echo 'Verified scale-out under load and scale-in after load removal.'
          }

          mini_project() {
            kubectl -n "$ns" apply -f "$section/03-mini-project/app.yaml"
            kubectl -n "$ns" rollout status deployment/notes-app --timeout=240s
            kubectl -n "$ns" get pvc,pods,service,hpa
            kubectl -n "$ns" exec deployment/notes-app -- sh -c 'echo notes-marker > /usr/share/nginx/html/marker.txt'
            oldpod=$(kubectl -n "$ns" get pod -l app=notes-app -o jsonpath='{.items[0].metadata.name}')
            kubectl -n "$ns" delete pod "$oldpod"
            kubectl -n "$ns" rollout status deployment/notes-app --timeout=240s
            kubectl -n "$ns" exec deployment/notes-app -- grep notes-marker /usr/share/nginx/html/marker.txt
            kubectl -n "$ns" get deployment notes-app -o jsonpath='{.spec.template.spec.containers[0].startupProbe}{"\n"}{.spec.template.spec.containers[0].readinessProbe}{"\n"}{.spec.template.spec.containers[0].livenessProbe}{"\n"}'
            kubectl -n "$ns" exec deployment/notes-app -- mv /usr/share/nginx/html/index.html /usr/share/nginx/html/index.saved
            for attempt in $(seq 1 12); do
              ready=$(kubectl -n "$ns" get pod -l app=notes-app -o jsonpath='{.items[0].status.conditions[?(@.type=="Ready")].status}')
              [[ "$ready" == False ]] && break
              sleep 2
            done
            kubectl -n "$ns" get pods -l app=notes-app
            ready=$(kubectl -n "$ns" get pod -l app=notes-app -o jsonpath='{.items[0].status.conditions[?(@.type=="Ready")].status}')
            test "$ready" = False
            kubectl -n "$ns" get endpointslice -l kubernetes.io/service-name=notes-app -o yaml
            kubectl -n "$ns" exec deployment/notes-app -- mv /usr/share/nginx/html/index.saved /usr/share/nginx/html/index.html
            kubectl -n "$ns" wait --for=condition=Ready pod -l app=notes-app --timeout=120s
            kubectl -n "$ns" get pods -l app=notes-app
            echo 'Readiness failure and recovery verified.'
          }

          record "$section/evidence/01-volumes.txt" volumes
          record "$section/evidence/02-hpa.txt" autoscaling
          record "$section/evidence/03-mini-project.txt" mini_project
          kubectl delete namespace "$ns" --wait=true
          kubectl delete pv coursework-s13-pv --ignore-not-found

          ;;
          session14)
          ns=coursework-s14
          section=session14-troubleshooting
          kubectl create namespace "$ns" --dry-run=client -o yaml | kubectl apply -f -

          wait_reason() {
            local name="$1" reason="$2"
            for attempt in $(seq 1 60); do
              actual=$(kubectl -n "$ns" get pod "$name" -o jsonpath='{.status.containerStatuses[0].state.waiting.reason}')
              if [[ "$actual" == "$reason" ]]; then return; fi
              sleep 3
            done
            kubectl -n "$ns" describe pod "$name"
            return 1
          }

          commands() {
            kubectl -n "$ns" create deployment web --image=nginx:stable-alpine
            kubectl -n "$ns" rollout status deployment/web --timeout=240s
            kubectl -n "$ns" expose deployment web --port=80
            kubectl -n "$ns" run client --image=busybox:1.36 --labels=app=client --command -- sleep 3600
            wait_ready client
            kubectl -n "$ns" get all
            kubectl -n "$ns" get pods -o wide
            kubectl -n "$ns" get pods -o custom-columns=NAME:.metadata.name,NODE:.spec.nodeName,IP:.status.podIP
            kubectl -n "$ns" describe deployment web
            kubectl -n "$ns" logs deployment/web
            kubectl -n "$ns" exec client -- wget -qO- http://web
            kubectl -n "$ns" exec client -- cat /etc/resolv.conf
            kubectl -n "$ns" events
            kubectl explain pod.spec.containers.resources
            for attempt in $(seq 1 24); do
              kubectl -n "$ns" top pods 2>/dev/null && break
              sleep 5
            done
            kubectl -n "$ns" top pods
          }

          crash() {
            kubectl -n "$ns" apply -f "$section/labs/broken-crash.yaml"
            wait_reason crash-demo CrashLoopBackOff
            kubectl -n "$ns" get pod crash-demo
            kubectl -n "$ns" logs crash-demo --previous
            kubectl -n "$ns" describe pod crash-demo
            kubectl -n "$ns" delete pod crash-demo
            kubectl -n "$ns" apply -f "$section/labs/fixed-crash.yaml"
            wait_ready crash-demo
            kubectl -n "$ns" logs crash-demo
          }

          image_pull() {
            kubectl -n "$ns" apply -f "$section/labs/broken-image.yaml"
            wait_reason image-demo ImagePullBackOff
            kubectl -n "$ns" describe pod image-demo
            kubectl -n "$ns" events --for pod/image-demo
            kubectl -n "$ns" delete pod image-demo
            kubectl -n "$ns" apply -f "$section/labs/fixed-image.yaml"
            wait_ready image-demo
            kubectl -n "$ns" get pod image-demo -o wide
          }

          scheduling_and_mounts() {
            kubectl -n "$ns" apply -f "$section/labs/broken-pending.yaml"
            sleep 5
            kubectl -n "$ns" get pod pending-demo
            kubectl -n "$ns" describe pod pending-demo
            phase=$(kubectl -n "$ns" get pod pending-demo -o jsonpath='{.status.phase}')
            test "$phase" = Pending
            kubectl -n "$ns" delete pod pending-demo
            kubectl -n "$ns" apply -f "$section/labs/fixed-pending.yaml"
            wait_ready pending-demo
            kubectl -n "$ns" apply -f "$section/labs/broken-mount.yaml"
            sleep 8
            kubectl -n "$ns" get pod mount-demo
            kubectl -n "$ns" describe pod mount-demo
            kubectl -n "$ns" create configmap missing-config --from-literal=mode=incorrect
            wait_ready mount-demo
            kubectl -n "$ns" exec mount-demo -- cat /config/mode
            kubectl -n "$ns" patch configmap missing-config --type=merge -p '{"data":{"mode":"corrected"}}'
            for attempt in $(seq 1 30); do
              value=$(kubectl -n "$ns" exec mount-demo -- cat /config/mode)
              if [[ "$value" == corrected ]]; then break; fi
              sleep 5
            done
            test "$value" = corrected
            kubectl -n "$ns" exec mount-demo -- cat /config/mode
          }

          networking() {
            expect_error 'bad address' kubectl -n "$ns" exec client -- wget -T 3 -qO- http://wrong-service
            kubectl -n "$ns" exec client -- nslookup web.coursework-s14.svc.cluster.local
            kubectl -n "$ns" apply -f "$section/labs/network-policy.yaml"
            sleep 5
            expect_error 'timed out' kubectl -n "$ns" exec client -- wget -T 3 -qO- http://web
            kubectl -n "$ns" get networkpolicy -o yaml
            kubectl -n "$ns" apply -f "$section/labs/network-policy-allow.yaml"
            sleep 5
            kubectl -n "$ns" exec client -- wget -T 5 -qO- http://web
          }

          mini_project() {
            kubectl -n "$ns" apply -f "$section/mini-project/broken-image.yaml"
            wait_reason project-broken-pod ImagePullBackOff
            kubectl -n "$ns" describe pod project-broken-pod
            kubectl -n "$ns" set image pod/project-broken-pod app=nginx:stable-alpine
            wait_ready project-broken-pod
            kubectl -n "$ns" get pod project-broken-pod -o wide
            kubectl -n "$ns" apply -f "$section/mini-project/broken.yaml"
            sleep 15
            kubectl -n "$ns" get pods -l app=broken-web
            kubectl -n "$ns" describe deployment broken-web
            kubectl -n "$ns" describe pod -l app=broken-web
            kubectl -n "$ns" get service broken-web -o yaml
            kubectl -n "$ns" get endpointslice -l kubernetes.io/service-name=broken-web -o yaml
            echo 'Root causes: /wrong-health-path returns 404; Service selector does not match app label.'
            kubectl -n "$ns" apply -f "$section/mini-project/fixed.yaml"
            kubectl -n "$ns" rollout status deployment/broken-web --timeout=240s
            kubectl -n "$ns" get pods -l app=broken-web
            kubectl -n "$ns" get endpointslice -l kubernetes.io/service-name=broken-web -o yaml
            kubectl -n "$ns" exec client -- wget -T 5 -qO- http://broken-web
          }

          record "$section/evidence/01-commands.txt" commands
          record "$section/evidence/02-crashloop.txt" crash
          record "$section/evidence/03-image-pull.txt" image_pull
          record "$section/evidence/04-scheduling-configuration.txt" scheduling_and_mounts
          record "$section/evidence/05-networking-dns.txt" networking
          record "$section/evidence/06-mini-project.txt" mini_project
          kubectl delete namespace "$ns" --wait=true

          ;;
          session15)
          ns=coursework-s15
          section=session15-helm
          chart="$section/notes-chart"
          kubectl create namespace "$ns" --dry-run=client -o yaml | kubectl apply -f -

          verify_release() {
            local release="$1" expected="$2" replicas="$3"
            kubectl -n "$ns" rollout status "deployment/$release" --timeout=240s
            count=$(kubectl -n "$ns" get deployment "$release" -o jsonpath='{.status.readyReplicas}')
            test "$count" = "$replicas"
            kubectl -n "$ns" run "verify-$release" --rm -i --restart=Never --image=busybox:1.36 --command -- sh -c "wget -qO- http://$release | grep '$expected'"
            kubectl -n "$ns" get pods -l "app=$release"
          }

          commands() {
            scaffold=$(mktemp -d)
            helm create "$scaffold/example-chart"
            helm lint "$scaffold/example-chart"
            helm lint "$chart"
            helm template notes "$chart"
            helm repo add bitnami https://charts.bitnami.com/bitnami
            helm repo update
            helm search repo bitnami/nginx
            helm install notes "$chart" -n "$ns" --wait --timeout=240s
            helm list -n "$ns"
            helm status notes -n "$ns"
            helm get values notes -n "$ns" --all
            helm get manifest notes -n "$ns"
            helm history notes -n "$ns"
            verify_release notes 'Notes version one' 1
          }

          rollback() {
            helm upgrade notes "$chart" -n "$ns" --set replicaCount=3 --set 'message=Notes version two' --wait --timeout=240s
            verify_release notes 'Notes version two' 3
            helm upgrade notes "$chart" -n "$ns" --set replicaCount=1 --set 'message=Notes version three' --wait --timeout=240s
            verify_release notes 'Notes version three' 1
            helm rollback notes 2 -n "$ns" --wait --timeout=240s
            verify_release notes 'Notes version two' 3
            helm get values notes -n "$ns"
            helm history notes -n "$ns"
            helm uninstall notes -n "$ns" --wait
            helm list -n "$ns"
          }

          mini_project() {
            helm install notes-project "$chart" -n "$ns" --wait --timeout=240s
            verify_release notes-project 'Notes version one' 1
            helm upgrade notes-project "$chart" -n "$ns" -f "$chart/values-prod.yaml" --set 'message=Project version two' --wait --timeout=240s
            verify_release notes-project 'Project version two' 3
            kubectl -n "$ns" exec deployment/notes-project -- printenv APP_NAME ENVIRONMENT
            helm rollback notes-project 1 -n "$ns" --wait --timeout=240s
            verify_release notes-project 'Notes version one' 1
            helm history notes-project -n "$ns"
            helm uninstall notes-project -n "$ns" --wait
          }

          record "$section/evidence/01-helm-commands.txt" commands
          record "$section/evidence/02-rollback.txt" rollback
          record "$section/evidence/03-mini-project.txt" mini_project
          kubectl delete namespace "$ns" --wait=true

          ;;
          basics)

          linux_logs() {
            journalctl --no-pager -n 15
            journalctl -u docker --no-pager -n 15
            systemctl is-active docker
          }

          git_practice() {
            git log --oneline --graph --all -18
            git show --stat ff062cc
            git show 4b7e9a3:git-and-github/cherry-picked-change.txt
            git show ff062cc:git-and-github/cherry-picked-change.txt
            echo 'Original and cherry-picked commits contain the same selected change.'
            directory=$(mktemp -d)
            git -C "$directory" init --initial-branch=main
            git -C "$directory" config user.name 'Coursework practice'
            git -C "$directory" config user.email 'coursework@example.invalid'
            printf 'initial\n' > "$directory/tracked.txt"
            git -C "$directory" add tracked.txt
            git -C "$directory" commit -m 'Initialize practice'
            printf 'changed\n' >> "$directory/tracked.txt"
            printf 'new\n' > "$directory/new.txt"
            git -C "$directory" status --short
            git -C "$directory" commit -a -m 'Automatically stage tracked changes'
            git -C "$directory" status --short
            test "$(git -C "$directory" status --short)" = '?? new.txt'
            git -C "$directory" add new.txt
            git -C "$directory" commit -m 'Explicitly stage the new file'
            git -C "$directory" status --short
            rm -rf "$directory"
          }

          kubernetes_basics() {
            ns=coursework-s9
            minikube status
            kubectl get nodes -o wide
            kubectl create namespace "$ns" --dry-run=client -o yaml | kubectl apply -f -
            kubectl -n "$ns" create deployment tutorial-web --image=nginx:1.27-alpine
            kubectl -n "$ns" rollout status deployment/tutorial-web --timeout=240s
            kubectl -n "$ns" get deployment,replicaset,pods -o wide
            kubectl -n "$ns" describe deployment tutorial-web
            kubectl -n "$ns" logs deployment/tutorial-web --tail=10
            kubectl -n "$ns" expose deployment tutorial-web --port=80
            kubectl -n "$ns" run tutorial-client --image=busybox:1.36 --command -- sleep 3600
            wait_ready tutorial-client
            kubectl -n "$ns" exec tutorial-client -- wget -qO- http://tutorial-web
            kubectl -n "$ns" scale deployment/tutorial-web --replicas=3
            kubectl -n "$ns" rollout status deployment/tutorial-web --timeout=240s
            kubectl -n "$ns" get pods -o wide
            kubectl -n "$ns" set image deployment/tutorial-web nginx=nginx:stable-alpine
            kubectl -n "$ns" rollout status deployment/tutorial-web --timeout=240s
            kubectl -n "$ns" rollout history deployment/tutorial-web
            kubectl -n "$ns" rollout undo deployment/tutorial-web
            kubectl -n "$ns" rollout status deployment/tutorial-web --timeout=240s
            kubectl -n "$ns" exec tutorial-client -- wget -qO- http://tutorial-web
            kubectl delete namespace "$ns" --wait=true
          }

          ingress_troubleshooting() {
            ns=coursework-s12-repair
            kubectl create namespace "$ns" --dry-run=client -o yaml | kubectl apply -f -
            kubectl -n "$ns" apply -f session-12-ingress-configmaps-secrets/troubleshooting/broken.yaml
            sleep 10
            kubectl -n "$ns" get pods
            kubectl -n "$ns" describe pod repair-web
            kubectl -n "$ns" get service repair-web -o yaml
            kubectl -n "$ns" get endpointslice -l kubernetes.io/service-name=repair-web -o yaml
            echo 'Root causes: missing ConfigMap prevents container startup; incorrect Service selector prevents endpoint selection.'
            kubectl -n "$ns" apply -f session-12-ingress-configmaps-secrets/troubleshooting/fixed.yaml
            wait_ready repair-web
            kubectl -n "$ns" exec repair-web -- printenv APP_MODE
            kubectl -n "$ns" get endpointslice -l kubernetes.io/service-name=repair-web -o yaml
            kubectl -n "$ns" run repair-client --rm -i --restart=Never --image=busybox:1.36 --command -- wget -qO- http://repair-web
            kubectl delete namespace "$ns" --wait=true
          }

          record linux-fundamentals/evidence/service-journal.txt linux_logs
          record git-and-github/evidence/commit-and-cherry-pick.txt git_practice
          record session9-k8s/evidence/basics-tutorial.txt kubernetes_basics
          record session-12-ingress-configmaps-secrets/evidence/troubleshooting.txt ingress_troubleshooting

          ;;
          esac
      - name: Render evidence into session READMEs
        run: |
          python - ${{ matrix.sections }} <<'PY'
          #!/usr/bin/env python3
          """Render genuine saved lab output and embed each image in its session README."""
          import argparse
          import re
          import textwrap
          from pathlib import Path

          from PIL import Image, ImageDraw, ImageFont


          def main():
              parser = argparse.ArgumentParser()
              parser.add_argument("sessions", nargs="+")
              args = parser.parse_args()
              for name in args.sessions:
                  root = Path(name)
                  outputs = sorted((root / "evidence").glob("*.txt"))
                  if not outputs:
                      raise SystemExit(f"No recorded output for {name}")
                  blocks = ["## Recorded execution evidence", "",
                            "These PNGs render the saved output of real commands. Each image links to its complete transcript.", ""]
                  for source in outputs:
                      text = re.sub(r"\x1b\[[0-9;]*[a-zA-Z]", "", source.read_text(errors="replace"))
                      lines = [part for line in text.splitlines() for part in
                               (textwrap.wrap(line.expandtabs(4), 118, replace_whitespace=False) or [""])]
                      font_path = next((p for p in ["/usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf",
                                                   "/System/Library/Fonts/Menlo.ttc"] if Path(p).exists()), None)
                      font = ImageFont.truetype(font_path, 16) if font_path else ImageFont.load_default()
                      for page, start in enumerate(range(0, max(1, len(lines)), 55), 1):
                          shown = lines[start:start + 55]
                          image = Image.new("RGB", (1280, 112 + 23 * len(shown)), "#0d1117")
                          draw = ImageDraw.Draw(image)
                          draw.rectangle((0, 0, 1280, 46), fill="#21262d")
                          draw.text((22, 14), f"{root.name} / {source.name} / {page}", font=font, fill="#f0f6fc")
                          for i, line in enumerate(shown):
                              draw.text((22, 62 + i * 23), line, font=font,
                                        fill="#7ee787" if line.startswith("$ ") else "#c9d1d9")
                          draw.text((22, image.height - 30), "Recorded command output; full transcript linked below", font=font, fill="#8b949e")
                          destination = root / "screenshots" / f"{source.stem}-{page:02}.png"
                          destination.parent.mkdir(parents=True, exist_ok=True)
                          image.save(destination)
                          blocks += [f"![{source.stem}, page {page}]({destination.relative_to(root)})", ""]
                      blocks += [f"[Complete commands and output: {source.name}]({source.relative_to(root)})", ""]
                  readme = root / "README.md"
                  current = readme.read_text().split("## Recorded execution evidence")[0].rstrip()
                  readme.write_text(current + "\n\n" + "\n".join(blocks))


          if __name__ == "__main__":
              main()

          PY
      - name: Collect reviewable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ matrix.lab }}
          path: |
            **/evidence/*.txt
            **/screenshots/*.png
            **/README.md
          retention-days: 14

  cicd:
    name: Session 16 build, test, registry and deployment
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lab tools and start Kubernetes
        run: |
          python -m pip install Pillow PyYAML
          curl -fsSL https://storage.googleapis.com/minikube/releases/latest/minikube-linux-amd64 -o /tmp/minikube
          sudo install /tmp/minikube /usr/local/bin/minikube
          helm_release=v3.17.3
          curl -fsSL "https://get.helm.sh/helm-${helm_release}-linux-amd64.tar.gz" -o /tmp/helm.tar.gz
          tar -xzf /tmp/helm.tar.gz -C /tmp
          sudo install /tmp/linux-amd64/helm /usr/local/bin/helm
          minikube start --driver=docker --cpus=2 --memory=4096 --cni=calico
          minikube addons enable metrics-server
          kubectl -n kube-system rollout status deployment/metrics-server --timeout=240s
          kubectl get nodes -o wide
      - name: CI and CD
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COURSEWORK_PUBLISH_IMAGES: '1'
        run: |
          set -euo pipefail

          repo_root="$GITHUB_WORKSPACE"
          cd "$repo_root"

          record() {
            local destination="$1"
            shift
            mkdir -p "$(dirname "$destination")"
            (
              set -euo pipefail
              PS4='$ '
              set -x
              "$@"
            ) > "$destination" 2>&1
            cat "$destination"
          }

          wait_ready() {
            kubectl -n "$ns" wait --for=condition=Ready "pod/$1" --timeout=240s
          }

          expect_error() {
            local expected="$1"
            shift
            local result
            if result=$("$@" 2>&1); then
              printf '%s\n' "$result"
              echo "Expected a failure but the command succeeded." >&2
              return 1
            fi
            printf '%s\n' "$result"
            [[ "$result" == *"$expected"* ]]
          }

          publish_image() {
          set -euo pipefail
          source_image="$1"
          package="$2"
          output="$3"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          destination="ghcr.io/$owner/$package:${GITHUB_SHA}"
          mkdir -p "$(dirname "$output")"
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag "$source_image" "$destination"
          {
            printf '$ docker push %s\n' "$destination"
            docker push "$destination"
            printf '$ docker image inspect %s --format {{.Id}}\n' "$destination"
            docker image inspect "$destination" --format '{{.Id}}'
          } > "$output" 2>&1
          cat "$output"

          }

          ns=coursework-s16
          section=session16-cicd

          build_test() {
            cd "$repo_root/$section"
            python -m pip install -r requirements-dev.txt
            python -m pytest -v --cov=app --cov-report=term-missing --junitxml=build-tests.xml
            bash build.sh
            cat build/build-info.txt
            echo 'GitHub workflow artifact: calculator build directory and execution evidence.'
            echo 'Registry authentication is performed outside the recorded shell trace.'
            docker build -t coursework-calculator:lab .
          }

          deploy() {
            minikube image load coursework-calculator:lab
            kubectl create namespace "$ns" --dry-run=client -o yaml | kubectl apply -f -
            kubectl -n "$ns" create deployment calculator --image=coursework-calculator:lab
            kubectl -n "$ns" rollout status deployment/calculator --timeout=240s
            kubectl -n "$ns" expose deployment calculator --port=80 --target-port=5001
            kubectl -n "$ns" port-forward service/calculator 15016:80 > /tmp/coursework-s16-forward.log 2>&1 &
            forward_pid=$!
            trap 'kill "$forward_pid" 2>/dev/null || true' EXIT
            for attempt in $(seq 1 20); do
              curl -fsS http://localhost:15016/health && break
              sleep 2
            done
            curl -fsS http://localhost:15016/health
            curl -fsS -H 'Content-Type: application/json' -d '{"a":6,"b":3,"operation":"multiply"}' http://localhost:15016/calculate
            kubectl -n "$ns" get pods,service -o wide
            kill "$forward_pid"
            trap - EXIT
          }

          record "$section/evidence/01-build-tests.txt" build_test
          if [[ "${COURSEWORK_PUBLISH_IMAGES:-0}" = 1 ]]; then
            publish_image coursework-calculator:lab session16-calculator "$section/evidence/02-registry.txt"
          fi
          record "$section/evidence/03-kubernetes-deployment.txt" deploy
          kubectl delete namespace "$ns" --wait=true
      - name: Render evidence
        run: |
          python - session16-cicd <<'PY'
          #!/usr/bin/env python3
          """Render genuine saved lab output and embed each image in its session README."""
          import argparse
          import re
          import textwrap
          from pathlib import Path

          from PIL import Image, ImageDraw, ImageFont


          def main():
              parser = argparse.ArgumentParser()
              parser.add_argument("sessions", nargs="+")
              args = parser.parse_args()
              for name in args.sessions:
                  root = Path(name)
                  outputs = sorted((root / "evidence").glob("*.txt"))
                  if not outputs:
                      raise SystemExit(f"No recorded output for {name}")
                  blocks = ["## Recorded execution evidence", "",
                            "These PNGs render the saved output of real commands. Each image links to its complete transcript.", ""]
                  for source in outputs:
                      text = re.sub(r"\x1b\[[0-9;]*[a-zA-Z]", "", source.read_text(errors="replace"))
                      lines = [part for line in text.splitlines() for part in
                               (textwrap.wrap(line.expandtabs(4), 118, replace_whitespace=False) or [""])]
                      font_path = next((p for p in ["/usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf",
                                                   "/System/Library/Fonts/Menlo.ttc"] if Path(p).exists()), None)
                      font = ImageFont.truetype(font_path, 16) if font_path else ImageFont.load_default()
                      for page, start in enumerate(range(0, max(1, len(lines)), 55), 1):
                          shown = lines[start:start + 55]
                          image = Image.new("RGB", (1280, 112 + 23 * len(shown)), "#0d1117")
                          draw = ImageDraw.Draw(image)
                          draw.rectangle((0, 0, 1280, 46), fill="#21262d")
                          draw.text((22, 14), f"{root.name} / {source.name} / {page}", font=font, fill="#f0f6fc")
                          for i, line in enumerate(shown):
                              draw.text((22, 62 + i * 23), line, font=font,
                                        fill="#7ee787" if line.startswith("$ ") else "#c9d1d9")
                          draw.text((22, image.height - 30), "Recorded command output; full transcript linked below", font=font, fill="#8b949e")
                          destination = root / "screenshots" / f"{source.stem}-{page:02}.png"
                          destination.parent.mkdir(parents=True, exist_ok=True)
                          image.save(destination)
                          blocks += [f"![{source.stem}, page {page}]({destination.relative_to(root)})", ""]
                      blocks += [f"[Complete commands and output: {source.name}]({source.relative_to(root)})", ""]
                  readme = root / "README.md"
                  current = readme.read_text().split("## Recorded execution evidence")[0].rstrip()
                  readme.write_text(current + "\n\n" + "\n".join(blocks))


          if __name__ == "__main__":
              main()

          PY
      - name: Upload build and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-cicd
          path: |
            README.md
            session16-cicd/README.md
            session16-cicd/evidence/
            session16-cicd/screenshots/
            session16-cicd/build/
            session16-cicd/build-tests.xml
          retention-days: 14

