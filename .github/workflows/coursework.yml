            git add session20-monitoring/gitops/app.yaml
            if ! git diff --cached --quiet; then
              git commit -m 'Initialize GitOps scaling demonstration [skip ci]'
            fi
            git push origin "HEAD:$revision"
            kubectl -n argocd patch application coursework-gitops --type=merge -p "{\"spec\":{\"source\":{\"targetRevision\":\"$revision\"}}}"
