            test "$converged" = 1
            kubectl -n "$ns" get deployment gitops-web
            kubectl -n "$ns" scale deployment/gitops-web --replicas=1
            kubectl -n "$ns" get deployment gitops-web
            kubectl -n argocd annotate application coursework-gitops argocd.argoproj.io/refresh=hard --overwrite
            healed=0
            for attempt in $(seq 1 60); do
              replicas=$(kubectl -n "$ns" get deployment gitops-web -o jsonpath='{.status.readyReplicas}')
              desired=$(kubectl -n "$ns" get deployment gitops-web -o jsonpath='{.spec.replicas}')
              if [[ "$replicas" == 3 && "$desired" == 3 ]]; then healed=1; break; fi
              sleep 5
            done
            test "$healed" = 1
            kubectl -n "$ns" get deployment gitops-web
            echo 'Git change scaled two replicas to three; direct cluster drift was reconciled back to three.'
            kubectl -n "$ns" get configmap gitops-page -o yaml
            kubectl -n "$ns" patch configmap gitops-page --type=merge -p '{"data":{"index.html":"DRIFT introduced directly in the cluster"}}'
            kubectl -n "$ns" get configmap gitops-page -o jsonpath='{.data.index\.html}{"\n"}'
            kubectl -n argocd annotate application coursework-gitops argocd.argoproj.io/refresh=hard --overwrite
            restored=0
            for attempt in $(seq 1 60); do
              page=$(kubectl -n "$ns" get configmap gitops-page -o jsonpath='{.data.index\.html}')
              if [[ "$page" == 'Managed from Git: coursework GitOps demo' ]]; then restored=1; break; fi
              sleep 5
            done
            test "$restored" = 1
            kubectl -n "$ns" get configmap gitops-page -o yaml
            kubectl -n argocd get application coursework-gitops -o wide
            kubectl -n "$ns" run gitops-client --rm -i --restart=Never --image=busybox:1.36 --command -- wget -qO- http://gitops-web
            echo 'Argo CD restored Git-defined configuration after live drift.'
          }

          mkdir -p "$section/screenshots"
          record "$section/evidence/01-monitoring-alerts.txt" monitoring
          record "$section/evidence/02-gitops-reconciliation.txt" gitops
          kubectl delete namespace "$ns" argocd --wait=false
      - name: Render evidence
        run: |
          python - Hello-CICD session20-monitoring <<'PY'
          #!/usr/bin/env python3
          """Render genuine saved lab output and embed each image in its session README."""
          import argparse
          import re
          import textwrap
          from pathlib import Path

          from PIL import Image, ImageDraw, ImageFont


          def main():
              parser = argparse.ArgumentParser()
              parser.add_argument("sessions", nargs="+")
              args = parser.parse_args()
              for name in args.sessions:
                  root = Path(name)
                  outputs = sorted((root / "evidence").glob("*.txt"))
                  if not outputs:
                      raise SystemExit(f"No recorded output for {name}")
                  blocks = ["## Recorded execution evidence", "",
                            "These PNGs render the saved output of real commands. Each image links to its complete transcript.", ""]
                  for source in outputs:
                      text = re.sub(r"\x1b\[[0-9;]*[a-zA-Z]", "", source.read_text(errors="replace"))
                      lines = [part for line in text.splitlines() for part in
                               (textwrap.wrap(line.expandtabs(4), 118, replace_whitespace=False) or [""])]
                      font_path = next((p for p in ["/usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf",
                                                   "/System/Library/Fonts/Menlo.ttc"] if Path(p).exists()), None)
                      font = ImageFont.truetype(font_path, 16) if font_path else ImageFont.load_default()
                      for page, start in enumerate(range(0, max(1, len(lines)), 55), 1):
                          shown = lines[start:start + 55]
                          image = Image.new("RGB", (1280, 112 + 23 * len(shown)), "#0d1117")
                          draw = ImageDraw.Draw(image)
                          draw.rectangle((0, 0, 1280, 46), fill="#21262d")
                          draw.text((22, 14), f"{root.name} / {source.name} / {page}", font=font, fill="#f0f6fc")
                          for i, line in enumerate(shown):
                              draw.text((22, 62 + i * 23), line, font=font,
                                        fill="#7ee787" if line.startswith("$ ") else "#c9d1d9")
                          draw.text((22, image.height - 30), "Recorded command output; full transcript linked below", font=font, fill="#8b949e")
                          destination = root / "screenshots" / f"{source.stem}-{page:02}.png"
                          destination.parent.mkdir(parents=True, exist_ok=True)
                          image.save(destination)
                          blocks += [f"![{source.stem}, page {page}]({destination.relative_to(root)})", ""]
                      blocks += [f"[Complete commands and output: {source.name}]({source.relative_to(root)})", ""]
                  readme = root / "README.md"
                  current = readme.read_text().split("## Recorded execution evidence")[0].rstrip()
                  readme.write_text(current + "\n\n" + "\n".join(blocks))


          if __name__ == "__main__":
              main()

          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-devsecops
          path: |
            README.md
            Hello-CICD/README.md
            Hello-CICD/evidence/
            Hello-CICD/screenshots/
            Hello-CICD/test-results.xml
            session20-monitoring/README.md
            session20-monitoring/evidence/
            session20-monitoring/screenshots/
            session20-monitoring/gitops/
          retention-days: 14

  terraform:
    name: Terraform configuration verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Verify schemas and mock-provider plans
        run: |
          set -euo pipefail

          repo_root="$GITHUB_WORKSPACE"
          cd "$repo_root"

          record() {
            local destination="$1"
            shift
            mkdir -p "$(dirname "$destination")"
            (
              set -euo pipefail
              PS4='$ '
              set -x
              "$@"
            ) > "$destination" 2>&1
            cat "$destination"
          }

          wait_ready() {
            kubectl -n "$ns" wait --for=condition=Ready "pod/$1" --timeout=240s
          }

          expect_error() {
            local expected="$1"
            shift
            local result
            if result=$("$@" 2>&1); then
              printf '%s\n' "$result"
              echo "Expected a failure but the command succeeded." >&2
              return 1
            fi
            printf '%s\n' "$result"
            [[ "$result" == *"$expected"* ]]
          }

          publish_image() {
          set -euo pipefail
          source_image="$1"
          package="$2"
          output="$3"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          destination="ghcr.io/$owner/$package:${GITHUB_SHA}"
          mkdir -p "$(dirname "$output")"
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag "$source_image" "$destination"
          {
            printf '$ docker push %s\n' "$destination"
            docker push "$destination"
            printf '$ docker image inspect %s --format {{.Id}}\n' "$destination"
            docker image inspect "$destination" --format '{{.Id}}'
          } > "$output" 2>&1
          cat "$output"

          }


          verify() {
            local directory="$1"
            cd "$repo_root/$directory"
            terraform version
            terraform init -backend=false -input=false -no-color
            terraform fmt -check -recursive
            terraform validate -no-color
            terraform test -no-color
            terraform graph
          }

          record session18-terraform-iac/evidence/01-terraform-verification.txt verify session18-terraform-iac/terraform-s3-demo
          record session19-cloud-terraform/evidence/01-terraform-verification.txt verify session19-cloud-terraform/cloud-infra
