          python - <<'PY'
          #!/usr/bin/env python3
          """Build the submission index from verified artifacts and check relative links."""
          import os
          import re
          from pathlib import Path

          SECTIONS = [
              ('1 & 2', 'Linux Fundamentals', 'linux-fundamentals'),
              ('3', 'Shell Scripting', 'shell-scripting'),
              ('4', 'Networking', 'networking'),
              ('5', 'Git and GitHub', 'git-and-github'),
              ('6', 'Docker Fundamentals', 'docker-fundamentals'),
              ('7', 'Docker Images', 'docker-images'),
              ('8', 'Docker Networking', 'docker-networking'),
              ('9', 'Kubernetes Fundamentals', 'session9-k8s'),
              ('10', 'Pods, ReplicaSets & Deployments', 'session10-k8s-core-objects'),
              ('11', 'Networking & Services', 'session-11-kubernetes-services'),
              ('12', 'Ingress, ConfigMaps & Secrets', 'session-12-ingress-configmaps-secrets'),
              ('13', 'Storage, HPA & Probes', 'session13-storage-hpa-probes'),
              ('14', 'Kubernetes Troubleshooting', 'session14-troubleshooting'),
              ('15', 'Helm', 'session15-helm'),
              ('16', 'CI/CD & GitHub Actions', 'session16-cicd'),
              ('17', 'Complete CI/CD & DevSecOps', 'Hello-CICD'),
              ('18', 'Terraform & Infrastructure as Code', 'session18-terraform-iac'),
              ('19', 'Cloud & Terraform in Action', 'session19-cloud-terraform'),
              ('20', 'Monitoring, Observability & GitOps', 'session20-monitoring'),
          ]


          def main():
              run_url = os.environ.get('COURSEWORK_RUN_URL')
              lines = ['# DevOps Coursework', '',
                       '**Student:** Prabhav Semwal · **Enrollment:** 24BCS10358', '',
                       'Each assignment README links its code, exact commands, explanations and execution evidence.', '',
                       '| Session | Assignment README |', '| --- | --- |']
              for number, title, directory in SECTIONS:
                  lines.append(f'| {number} | [{title}]({directory}/README.md) |')
                  readme = Path(directory) / 'README.md'
                  if not readme.exists():
                      raise SystemExit(f'Missing README: {readme}')
                  if run_url and directory in ['git-and-github', 'linux-fundamentals', 'session9-k8s',
                                              'session-12-ingress-configmaps-secrets', 'session13-storage-hpa-probes',
                                              'session14-troubleshooting', 'session15-helm', 'session16-cicd',
                                              'Hello-CICD', 'session18-terraform-iac', 'session19-cloud-terraform', 'session20-monitoring']:
                      text = readme.read_text()
                      text = re.sub(r'\n\[Verified workflow execution\]\([^\n]+\)\n?', '\n', text)
                      readme.write_text(text.rstrip() + f'\n\n[Verified workflow execution]({run_url})\n')
              lines += ['', '## Evidence', '',
                        'Docker application pages were captured from running containers. Terminal PNGs and SVGs render real saved command output and link to their source transcripts. The hosted coursework workflow executes isolated Minikube labs and retains build artifacts.', '',
                        'Terraform sections demonstrate configuration verification and mock-provider plan assertions.', '']
              Path('README.md').write_text('\n'.join(lines))
              for _, _, directory in SECTIONS:
                  for readme in Path(directory).rglob('README.md'):
                      if any(part in readme.parts for part in ['.venv', '.pytest_cache', 'node_modules']):
                          continue
                      for target in re.findall(r'!?\[[^\]]*\]\(([^)]+)\)', readme.read_text()):
                          if target.startswith(('http:', 'https:', '#')):
                              continue
                          if not (readme.parent / target.split('#')[0]).exists():
                              raise SystemExit(f'Broken link in {readme}: {target}')
              print(f'Verified READMEs and relative links for {len(SECTIONS)} assignment sections.')


          if __name__ == '__main__':
              main()

          PY
      - name: Upload completed READMEs and screenshots
        uses: actions/upload-artifact@v4
        with:
          name: coursework-submission-evidence
          include-hidden-files: true
          path: |
            README.md
            **/README.md
            **/evidence/*.txt
            **/screenshots/*.png
            session18-terraform-iac/terraform-s3-demo/.terraform.lock.hcl
