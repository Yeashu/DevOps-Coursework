<text x="18" y="62">$ date --iso-8601=seconds</text><text x="18" y="82">2026-09-04T15:53:17+00:00</text><text x="18" y="102"></text><text x="18" y="122">=== Soft link and hard link ===</text><text x="18" y="142">$ ls -li original.txt soft-link.txt hard-link.txt</text><text x="18" y="162">1441846 -rw-rw-rw- 2 vscode vscode 21 Sep  4 15:53 hard-link.txt</text><text x="18" y="182">1441846 -rw-rw-rw- 2 vscode vscode 21 Sep  4 15:53 original.txt</text><text x="18" y="202">1441847 lrwxrwxrwx 1 vscode vscode 12 Sep  4 15:53 soft-link.txt -&gt; original.txt</text><text x="18" y="222">$ readlink soft-link.txt</text><text x="18" y="242">original.txt</text><text x="18" y="262">Practice files removed successfully.</text><text x="18" y="282"></text><text x="18" y="302">=== adduser and useradd ===</text><text x="18" y="322">$ command -V adduser</text><text x="18" y="342">adduser is /usr/sbin/adduser</text><text x="18" y="362">$ command -V useradd</text><text x="18" y="382">useradd is /usr/sbin/useradd</text><text x="18" y="402">$ sudo adduser --disabled-password --gecos &#x27;&#x27; coursework-user</text><text x="18" y="422">usermod: no changes</text><text x="18" y="442">$ getent passwd coursework-user</text><text x="18" y="462">coursework-user:x:1002:1002::/home/coursework-user:/bin/bash</text><text x="18" y="482">$ sudo deluser --remove-home coursework-user</text><text x="18" y="502">warn: `/usr/bin/crontab&#x27; is not executable. Skipping crontab removal. Package `cron&#x27; required.</text><text x="18" y="522"></text><text x="18" y="542">=== journalctl ===</text><text x="18" y="562">$ ps -p 1 -o comm=</text><text x="18" y="582">sh</text><text x="18" y="602">$ journalctl --no-pager -n 20</text><text x="18" y="622">No journal files were found.</text><text x="18" y="642">-- No entries --</text><text x="18" y="662">$ journalctl -u docker --since today --no-pager</text><text x="18" y="682">No journal files were found.</text><text x="18" y="702">-- No entries --</text><text x="18" y="722"></text><text x="18" y="742">=== Linux command practice ===</text><text x="18" y="762">$ pwd</text><text x="18" y="782">/workspaces/DevOps-Coursework/.evidence-work/system</text><text x="18" y="802">$ ls -lah</text><text x="18" y="822">total 8.0K</text><text x="18" y="842">drwxrwxrwx+  2 vscode vscode 4.0K Sep  4 15:53 .</text><text x="18" y="862">drwxrwxrwx+  3 vscode vscode 4.0K Sep  4 15:53 ..</text><text x="18" y="882">$ df -h /</text><text x="18" y="902">Filesystem      Size  Used Avail Use% Mounted on</text><text x="18" y="922">overlay          32G  1.4G   29G   5% /</text><text x="18" y="942">$ free -h</text><text x="18" y="962">               total        used        free      shared  buff/cache   available</text><text x="18" y="982">Mem:           7.8Gi       1.3Gi       212Mi        67Mi       6.7Gi       6.5Gi</text><text x="18" y="1002">Swap:             0B          0B          0B</text><text x="18" y="1022">$ ps -ef</text><text x="18" y="1042">UID          PID    PPID  C STIME TTY          TIME CMD</text><text x="18" y="1062">root           1       0  0 15:50 ?        00:00:00 /bin/sh -c echo Container started trap &quot;exit 0&quot; 15 /usr/local/share/docker-init.sh /usr/local/share/ssh-init.sh exec &quot;$@&quot; while sleep 1 &amp; wait $!; do :; done -</text><text x="18" y="1082">root          23       1  0 15:50 ?        00:00:00 dockerd --dns 168.63.129.16</text><text x="18" y="1102">root          32      23  0 15:50 ?        00:00:00 /usr/bin/containerd --config /var/run/docker/containerd/containerd.toml</text><text x="18" y="1122">root         311       1  0 15:50 ?        00:00:00 sshd: /usr/sbin/sshd [listener] 0 of 10-100 startups</text><text x="18" y="1142">root        1665     311  0 15:53 ?        00:00:00 sshd-session: vscode [priv]</text><text x="18" y="1162">root        1667       1  0 15:53 ?        00:00:00 sleep 1</text><text x="18" y="1182">vscode      1678    1665  0 15:53 ?        00:00:00 sshd-session: vscode@notty</text><text x="18" y="1202">vscode      1679    1678  0 15:53 ?        00:00:00 bash -c cd /workspaces/DevOps-Coursework &amp;&amp; ./scripts/capture-system-evidence.sh &amp;&amp; wc -l linux-fundamentals/evidence/linux-output.txt shell-scripting/evidence/system-info-output.txt networking/evidence/networking-output.txt &amp;&amp; tail -8 networking/evidence/networking-output.txt</text><text x="18" y="1222">vscode      1680    1679  0 15:53 ?        00:00:00 bash ./scripts/capture-system-evidence.sh</text><text x="18" y="1242">vscode      1746    1680  0 15:53 ?        00:00:00 ps -ef</text>
