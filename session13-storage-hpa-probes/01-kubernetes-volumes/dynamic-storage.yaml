{
  "apiVersion": "v1",
  "kind": "PersistentVolumeClaim",
  "metadata": {
    "name": "dynamic-data"
  },
  "spec": {
    "accessModes": [
      "ReadWriteOnce"
    ],
    "resources": {
      "requests": {
        "storage": "128Mi"
      }
    }
  }
}
---
{
  "apiVersion": "v1",
  "kind": "Pod",
  "metadata": {
    "name": "dynamic-demo",
    "labels": {
      "app": "dynamic-demo"
    }
  },
  "spec": {
    "containers": [
      {
        "name": "app",
        "image": "busybox:1.36",
        "volumeMounts": [
          {
            "name": "data",
            "mountPath": "/data"
          }
        ],
        "command": [
          "sh",
          "-c",
          "sleep 3600"
        ]
      }
    ],
    "volumes": [
      {
        "name": "data",
        "persistentVolumeClaim": {
          "claimName": "dynamic-data"
        }
      }
    ]
  }
}
