{
  "apiVersion": "v1",
  "kind": "Pod",
  "metadata": {
    "name": "emptydir-demo",
    "labels": {
      "app": "emptydir-demo"
    }
  },
  "spec": {
    "containers": [
      {
        "name": "app",
        "image": "busybox:1.36",
        "volumeMounts": [
          {
            "name": "data",
            "mountPath": "/data"
          }
        ],
        "command": [
          "sh",
          "-c",
          "sleep 3600"
        ]
      }
    ],
    "volumes": [
      {
        "name": "data",
        "emptyDir": {}
      }
    ]
  }
}
