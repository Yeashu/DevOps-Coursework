{
  "apiVersion": "v1",
  "kind": "Pod",
  "metadata": {
    "name": "hostpath-demo",
    "labels": {
      "app": "hostpath-demo"
    }
  },
  "spec": {
    "containers": [
      {
        "name": "app",
        "image": "busybox:1.36",
        "volumeMounts": [
          {
            "name": "data",
            "mountPath": "/data"
          }
        ],
        "command": [
          "sh",
          "-c",
          "sleep 3600"
        ]
      }
    ],
    "volumes": [
      {
        "name": "data",
        "hostPath": {
          "path": "/tmp/coursework-s13-hostpath",
          "type": "DirectoryOrCreate"
        }
      }
    ]
  }
}
