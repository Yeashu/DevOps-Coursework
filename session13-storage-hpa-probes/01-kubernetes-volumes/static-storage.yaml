{
  "apiVersion": "v1",
  "kind": "PersistentVolume",
  "metadata": {
    "name": "coursework-s13-pv"
  },
  "spec": {
    "capacity": {
      "storage": "128Mi"
    },
    "accessModes": [
      "ReadWriteOnce"
    ],
    "storageClassName": "coursework-static",
    "persistentVolumeReclaimPolicy": "Retain",
    "hostPath": {
      "path": "/tmp/coursework-s13-static",
      "type": "DirectoryOrCreate"
    }
  }
}
---
{
  "apiVersion": "v1",
  "kind": "PersistentVolumeClaim",
  "metadata": {
    "name": "static-data"
  },
  "spec": {
    "accessModes": [
      "ReadWriteOnce"
    ],
    "resources": {
      "requests": {
        "storage": "128Mi"
      }
    },
    "storageClassName": "coursework-static"
  }
}
---
{
  "apiVersion": "v1",
  "kind": "Pod",
  "metadata": {
    "name": "persistent-demo",
    "labels": {
      "app": "persistent-demo"
    }
  },
  "spec": {
    "containers": [
      {
        "name": "app",
        "image": "busybox:1.36",
        "volumeMounts": [
          {
            "name": "data",
            "mountPath": "/data"
          }
        ],
        "command": [
          "sh",
          "-c",
          "sleep 3600"
        ]
      }
    ],
    "volumes": [
      {
        "name": "data",
        "persistentVolumeClaim": {
          "claimName": "static-data"
        }
      }
    ]
  }
}
