{
  "apiVersion": "v1",
  "kind": "Pod",
  "metadata": {
    "name": "load-generator",
    "labels": {
      "app": "load-generator"
    }
  },
  "spec": {
    "containers": [
      {
        "name": "app",
        "image": "busybox:1.36",
        "command": [
          "sh",
          "-c",
          "for worker in 1 2 3 4; do (while true; do wget -q -O /dev/null http://cpu-demo; done) & done; wait"
        ]
      }
    ]
  }
}
