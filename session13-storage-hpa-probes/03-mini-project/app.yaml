{
  "apiVersion": "v1",
  "kind": "PersistentVolumeClaim",
  "metadata": {
    "name": "notes-data"
  },
  "spec": {
    "accessModes": [
      "ReadWriteOnce"
    ],
    "resources": {
      "requests": {
        "storage": "500Mi"
      }
    }
  }
}
---
{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "notes-app"
  },
  "spec": {
    "replicas": 2,
    "selector": {
      "matchLabels": {
        "app": "notes-app"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "notes-app"
        }
      },
      "spec": {
        "containers": [
          {
            "name": "app",
            "image": "nginx:stable-alpine",
            "ports": [
              {
                "containerPort": 80
              }
            ],
            "resources": {
              "requests": {
                "cpu": "100m",
                "memory": "32Mi"
              },
              "limits": {
                "cpu": "500m",
                "memory": "128Mi"
              }
            },
            "volumeMounts": [
              {
                "name": "data",
                "mountPath": "/usr/share/nginx/html"
              },
              {
                "name": "data",
                "mountPath": "/data"
              }
            ],
            "startupProbe": {
              "httpGet": {
                "path": "/",
                "port": 80
              },
              "periodSeconds": 2,
              "failureThreshold": 30
            },
            "readinessProbe": {
              "httpGet": {
                "path": "/",
                "port": 80
              },
              "periodSeconds": 2,
              "failureThreshold": 1
            },
            "livenessProbe": {
              "httpGet": {
                "path": "/",
                "port": 80
              },
              "periodSeconds": 5,
              "failureThreshold": 6
            }
          }
        ],
        "volumes": [
          {
            "name": "data",
            "persistentVolumeClaim": {
              "claimName": "notes-data"
            }
          }
        ],
        "initContainers": [
          {
            "name": "initialize",
            "image": "busybox:1.36",
            "volumeMounts": [
              {
                "name": "data",
                "mountPath": "/data"
              }
            ],
            "command": [
              "sh",
              "-c",
              "test -f /data/index.html || echo \"Persistent coursework notes\" > /data/index.html"
            ]
          }
        ]
      }
    },
    "strategy": {
      "type": "Recreate"
    }
  }
}
---
{
  "apiVersion": "v1",
  "kind": "Service",
  "metadata": {
    "name": "notes-app"
  },
  "spec": {
    "selector": {
      "app": "notes-app"
    },
    "ports": [
      {
        "port": 80,
        "targetPort": 80
      }
    ]
  }
}
---
{
  "apiVersion": "autoscaling/v2",
  "kind": "HorizontalPodAutoscaler",
  "metadata": {
    "name": "notes-app"
  },
  "spec": {
    "scaleTargetRef": {
      "apiVersion": "apps/v1",
      "kind": "Deployment",
      "name": "notes-app"
    },
    "minReplicas": 2,
    "maxReplicas": 5,
    "metrics": [
      {
        "type": "Resource",
        "resource": {
          "name": "cpu",
          "target": {
            "type": "Utilization",
            "averageUtilization": 50
          }
        }
      }
    ],
    "behavior": {
      "scaleDown": {
        "stabilizationWindowSeconds": 15
      }
    }
  }
}
