{
  "apiVersion": "v1",
  "kind": "Pod",
  "metadata": {
    "name": "mount-demo",
    "labels": {
      "app": "mount-demo"
    }
  },
  "spec": {
    "containers": [
      {
        "name": "app",
        "image": "busybox:1.36",
        "volumeMounts": [
          {
            "name": "config",
            "mountPath": "/config"
          }
        ],
        "command": [
          "sleep",
          "3600"
        ]
      }
    ],
    "volumes": [
      {
        "name": "config",
        "configMap": {
          "name": "missing-config"
        }
      }
    ]
  }
}
