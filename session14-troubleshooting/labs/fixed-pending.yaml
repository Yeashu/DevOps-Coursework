{
  "apiVersion": "v1",
  "kind": "Pod",
  "metadata": {
    "name": "pending-demo",
    "labels": {
      "app": "pending-demo"
    }
  },
  "spec": {
    "containers": [
      {
        "name": "app",
        "image": "busybox:1.36",
        "resources": {
          "requests": {
            "cpu": "10m"
          }
        },
        "command": [
          "sleep",
          "3600"
        ]
      }
    ]
  }
}
