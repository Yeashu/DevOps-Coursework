{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "broken-web"
  },
  "spec": {
    "replicas": 1,
    "selector": {
      "matchLabels": {
        "app": "broken-web"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "broken-web"
        }
      },
      "spec": {
        "containers": [
          {
            "name": "app",
            "image": "nginx:stable-alpine",
            "readinessProbe": {
              "httpGet": {
                "path": "/",
                "port": 80
              },
              "periodSeconds": 3
            }
          }
        ]
      }
    }
  }
}
---
{
  "apiVersion": "v1",
  "kind": "Service",
  "metadata": {
    "name": "broken-web"
  },
  "spec": {
    "selector": {
      "app": "broken-web"
    },
    "ports": [
      {
        "port": 80,
        "targetPort": 80
      }
    ]
  }
}
