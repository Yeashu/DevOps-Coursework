{
  "apiVersion": "v1",
  "kind": "ConfigMap",
  "metadata": {
    "name": "gitops-page"
  },
  "data": {
    "index.html": "Managed from Git: coursework GitOps demo"
  }
}
---
{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "gitops-web"
  },
  "spec": {
    "replicas": 3,
    "selector": {
      "matchLabels": {
        "app": "gitops-web"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "gitops-web"
        }
      },
      "spec": {
        "containers": [
          {
            "name": "app",
            "image": "nginx:stable-alpine",
            "volumeMounts": [
              {
                "name": "page",
                "mountPath": "/usr/share/nginx/html"
              }
            ]
          }
        ],
        "volumes": [
          {
            "name": "page",
            "configMap": {
              "name": "gitops-page"
            }
          }
        ]
      }
    }
  }
}
---
{
  "apiVersion": "v1",
  "kind": "Service",
  "metadata": {
    "name": "gitops-web"
  },
  "spec": {
    "selector": {
      "app": "gitops-web"
    },
    "ports": [
      {
        "port": 80,
        "targetPort": 80
      }
    ]
  }
}
